<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exponent · 2ⁿ−25 Prime Search</title>
<meta name="description" content="Everything known about one value of n: factors, PRP residue, history.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="site-header">
  <div class="bar">
    <div class="brand-nav">
      <a class="brand" href="index.html"><span class="brand-mark">2<sup>n</sup>−25</span><span class="brand-sub">Prime Search</span></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Status</a>
        <a href="ranges.html">Ranges</a>
        <a href="exponent.html" aria-current="page">Exponents</a>
        <a href="sieve.html">Sieve</a>
        <a href="primes.html">Primes</a>
        <a href="history.html">History</a>
        <a href="join.html">Join</a>
      </nav>
    </div>
    <form class="lookup" role="search" action="exponent.html">
      <label for="hdr-n">n =</label>
      <input id="hdr-n" class="input" name="n" type="text" inputmode="numeric" placeholder="3600025" autocomplete="off">
      <button class="btn" type="submit">Look up</button>
    </form>
  </div>
</header>
<main class="page" id="main">
  <div class="crumbs">
    <nav aria-label="Breadcrumb"><a href="ranges.html">Ranges</a><span aria-hidden="true">/</span><span id="crumb-range">—</span><span aria-hidden="true">/</span><span id="crumb-n">n</span></nav>
  </div>

  <section class="exp-grid">
    <article class="card identity" aria-labelledby="exp-title">
      <h1 id="exp-title">2<sup>n</sup> − 25</h1>
      <div class="facts" id="facts"><span class="loading">Loading…</span></div>
      <p class="verdict" id="verdict"></p>
      <p class="verdict-sub" id="verdict-sub"></p>
      <div class="navs" role="group" aria-label="Go to another n" id="navs"></div>
    </article>
    <article class="card" aria-labelledby="status-title">
      <div class="card-head"><h2 id="status-title">Last-known status</h2><span class="meta" id="status-meta"></span></div>
      <p class="status-line" id="status-line"></p>
      <div class="band" id="band"></div>
      <div class="table-wrap" id="tests"></div>
      <div class="banner" id="banner"></div>
    </article>
  </section>

  <section class="card" id="fx-card" aria-labelledby="fx-title">
    <div class="card-head"><h2 id="fx-title">Factoring effort</h2><span class="meta" id="fx-scope"></span></div>
    <div class="table-wrap" id="fx"></div>
    <p class="small" id="fx-note"></p>
  </section>

  <section class="card" aria-labelledby="fac-title">
    <div class="card-head"><h2 id="fac-title">Known prime factors</h2><span class="meta" id="fac-sum"></span></div>
    <div id="factors"></div>
  </section>

  <section class="row top">
    <div class="card wide"><h2>History</h2><div id="history"></div></div>
    <aside class="card narrow" aria-labelledby="props-title"><h2 id="props-title">Properties</h2><dl class="props" id="props"></dl></aside>
  </section>

  <section class="card" id="nb-card" aria-labelledby="nb-title">
    <div class="card-head"><h2 id="nb-title">Neighbourhood</h2><span class="meta" id="nb-meta"></span></div>
    <div class="strip" id="strip"></div>
    <div class="strip-ends" id="strip-ends"></div>
    <div class="legend" id="strip-legend"></div>
  </section>
</main>
<footer class="site-footer">
  <div class="bar">
    <span>Built from Prime95 results.json, P-1 logs and sieve output · data <span data-generated>…</span></span>
    <span class="links"><a href="https://github.com/RP-12000/2n-25">Source and data</a><a href="https://oeis.org/A379020">OEIS A379020</a><a href="http://www.primenumbers.net/prptop/prptop.php">PRP Records</a></span>
  </div>
</footer>
<script src="assets/app.js"></script>
<script src="assets/exponent.js"></script>
</body>
</html>
